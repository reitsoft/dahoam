<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Hintergrund: wie die Karte (navy-800 -> navy-950) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2742"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0a101d"/>
    </linearGradient>

    <!-- Weicher Teal-Schein hinter dem Haus (wie der Glow der Karte) -->
    <radialGradient id="halo" cx="256" cy="290" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#14b8a6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- Outline: teal-400 -> teal-500 -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="92" y1="100" x2="420" y2="412">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Leichter Glow -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.75"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Haus-Outline inkl. Schornstein -->
  <g fill="none" stroke="url(#line)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M256 100 L92 256 H128 V388 Q128 412 152 412 H360 Q384 412 384 388 V256 H420 Z"/>
    <path d="M330 172 V118"/>
  </g>

  <!-- Power-Symbol -->
  <g fill="none" stroke="#f4efe6" stroke-width="14" stroke-linecap="round" filter="url(#glow)">
    <path d="M278 297.9 A44 44 0 1 1 234 297.9"/>
    <path d="M256 284 V330"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
